# R1 + yolo_leaf_connected (20/11, user requirement: no distance window on the points inside a YOLO mask). The mask leaf is the
# largest 3D-connected group of the mask points (no +-depth cap); link radius max(0.5 m, per_m x median depth), per_m = 1.2 x
# the LiDAR ring spacing (OS1-128, 0.0062 rad). Same values as coda_vjsye2i2pcalc (19/11), now on R1.
base: coda_vjsye2i2pcar1
files:
  preprocessing.yaml:
    preprocessing_node:
      yolo_leaf_connected: true
      yolo_leaf_connect_radius: 0.5
      yolo_leaf_connect_radius_per_m: 0.0074
