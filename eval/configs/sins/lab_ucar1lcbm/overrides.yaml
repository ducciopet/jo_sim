# Neutral on 18/11 (P2) when the leaf was a +-0.3 m depth slice (its box covered a strip of the car); with the connected leaf the
# box covers the whole vehicle, so the pieces of one masked object become one object (C4-new without new code).
base: lab_ucar1lcb
files:
