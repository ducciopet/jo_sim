# mdp_street_vj (point-shift veto + jitter allowance) + latency settings + time coherence (mdp_street_sy)
base: mdp_street_vj
files:
  preprocessing.yaml:
    preprocessing_node:
      camera_pose_at_stamp: true
      yolo_leaf_sync: true
      yolo_leaf_sync_tol: 0.07
      yolo_leaf_aligned_path: true
      depth_trigger_early: true
  dbscan_detector.yaml:
    dbscan_detector_node:
      fusion_late_leaves_max_age: 0.3
      fusion_adaptive_wait: true
  static_structures.yaml:
    static_structures_node:
      pose_at_stamp: true
  tracker.yaml:
    tracker_node:
      yolo2d_time_compensation: true
  calibration_icp.yaml:
    calibration_icp_node:
      depth_transport_from_preprocessing: true
