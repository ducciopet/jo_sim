# mdp_street_vjsye2 + inherited motion state at track rebirth (track_inherit_motion_dist 0.6 m / _age 0.5 s): the DBG2 funnel
# (16/11) shows moving objects losing their dynamic state because their track dies and is reborn, restarting the
# C / debounce evidence from zero (pedestrians out of camera FOV, street vehicles)
base: mdp_street_vjsye2
files:
  tracker.yaml:
    tracker_node:
      track_inherit_motion_dist: 0.6
      track_inherit_motion_age: 0.5
