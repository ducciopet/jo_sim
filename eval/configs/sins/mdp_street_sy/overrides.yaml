# mdp_street_lt2 + time coherence of the camera products: depth frames posed at their own stamp, semantic leaves built from the
# YOLO detections of the same image, late leaves fused into the next scan, raw 2D boxes compared at the image instant
base: mdp_street_lt2
files:
  preprocessing.yaml:
    preprocessing_node:
      camera_pose_at_stamp: true
      yolo_leaf_sync: true
      yolo_leaf_sync_tol: 0.07
  dbscan_detector.yaml:
    dbscan_detector_node:
      fusion_late_leaves_max_age: 0.3
  tracker.yaml:
    tracker_node:
      yolo2d_time_compensation: true
