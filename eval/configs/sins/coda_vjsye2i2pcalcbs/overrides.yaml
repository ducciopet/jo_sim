# coda_vjsye2i2pcalcb + association speed gate from urban traffic (50 km/h + margin = 15 m/s), same inside and outside the camera
# field of view (19/11). With 8 / 4 m/s, ~10% of moving-car samples in CODa (90th percentile 9.4 m/s) could not be
# associated to their own track (re-born tracks, ID switches).
base: coda_vjsye2i2pcalcb
files:
  tracker.yaml:
    tracker_node:
      track_max_match_speed: 15.0
      track_outside_fov_max_match_speed: 15.0
