# CODa (UT Austin campus, outdoor): Ouster OS1-128 + ZED 2i left camera (cam3) with its depth; one camera.
# Only sensor setup and range here; method parameters come from the base profile (cfg/outdoor).
base: outdoor
files:
  # One camera in CODa's camera setup we use (ZED left + depth, front-facing).
  preprocessing.yaml:
    preprocessing_node:
      camera_names: [front_camera]
      # Range crop: 15 m in the base profile is set for a VLP-16 (2 deg between rings, a person at 15 m spans ~3
      # rings). The OS1-128 has 0.35 deg spacing: at 25 m a person still spans ~10 rings. 25 m is fixed here
      # from the sensor before looking at any result, and the evaluation uses the same radius.
      lidar_range_x: 25.0
      lidar_range_y: 25.0
      # Second camera for runs with STEREO=1 (camera_names:=front_camera,stereo_camera): CODa's cam0/cam1, one frame
      # per scan, depth computed online by eval/adapters/stereo_depth_node.py. Its depth range from a measurement
      # against the LiDAR (30 frames of seq 0): median error 2% up to 6 m (p90 0.24 m at 4-6 m), 3% beyond with p90
      # 0.6-0.9 m; the ZED (front_camera) keeps the base 4.5 m (median error 0.48 m at 4-6 m).
      stereo_camera: {aligned_depth_transport: zstd, aligned_depth_cloud_topic: /stereo_camera/camera/depth/color/points, depth_max_value: 6.0}
  static_structures.yaml:
    static_structures_node:
      camera_names: [front_camera]
      lidar_range_x: 25.0
      lidar_range_y: 25.0
  semantic_segmentation.yaml:
    yolo_semantic_seg_detector:
      camera_names: [front_camera]
      # YOLO classes: base list (person, bicycle, car, motorbike, bus, truck, dog, cat, horse) already covers
      # CODa's movable classes (Pedestrian, Bike, Car, Motorcycle, Horse, ...): not overridden.
      # Frame stride: the base profile's 2 is for a 30 Hz RealSense (YOLO at 15 Hz); CODa's color stream reaches the
      # bags at ~7.5 Hz, so stride 1 keeps YOLO at the camera's own rate instead of 3.7 Hz.
      detection_frame_stride: 1
  detection.yaml:
    yolo_seg_track_detector:
      camera_names: [front_camera]
  detection_yolo26.yaml:
    yolo_seg_track_detector:
      camera_names: [front_camera]
  tracker.yaml:
    tracker_node:
      camera_names: [front_camera]
      # Only classes CODa annotates get the potentially-dynamic label: no dog/cat/cow/sheep in its label set
      track_semantic_dynamic_classes: [person, car, bus, truck, motorbike, bicycle, horse]
      track_disocclusion_person_exempt: true   # heldout-v6 (04/11): walker-shaped track at walking speed exempt from the disocclusion guard
  dbscan_detector.yaml:
    dbscan_detector_node:
      # Ring spacing of the OS1-128, measured on CODa seq 0 (median elevation gap 0.33 deg; base profile: VLP-16, 2.0)
      lidar_eps_vertical_angle_deg: 0.33
      stereo_camera: {eps_scale: 1.0}
