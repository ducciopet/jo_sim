# M-detector config/kitti/kitti0.yaml (HDL-64 at 10 Hz, the closest upstream LiDAR to CODa's OS1-128 at 10 Hz) with only
# the sensor model, topics and robot footprint adapted to CODa (lines marked CODa). Every detection threshold keeps the
# upstream KITTI value. Replaces coda.yaml (nuScenes base) after the 06/11 fidelity audit (eval/baselines/FIDELITY.md).
dyn_obj:
    points_topic: "/velodyne_points"  # CODa: raw OS1-128 cloud, sensor frame (not deskewed: declared deviation)
    odom_topic: "/odom_velodyne"  # CODa: shared odometry for the velodyne frame (make_input_coda.py)
    frame_id: "odom"  # CODa: odom
    pc_topic: "/lidar_top"  # CODa: unused input

    dataset: 1  # CODa: 1 instead of 0, so the hard-coded KITTI-car self-mask boxes and the KITTI intensity==666 distortion flag are not applied (only differences between 0 and 1 in the code)
    use_odom_file: true
    stop_object_detect: false
    buffer_delay: 0.1
    buffer_size: 500000  # CODa: sized for 131k points/scan
    points_num_perframe: 150000  # CODa: OS1-128, 131072 points per scan
    depth_map_dur: 0.1
    max_depth_map_num: 15
    max_pixel_points: 5
    frame_dur: 0.1
    self_x_f: 0.45  # CODa: robot footprint around the LiDAR
    self_x_b: -0.6  # CODa: robot footprint
    self_y_l: 0.4  # CODa: robot footprint
    self_y_r: -0.4  # CODa: robot footprint
    blind_dis: 0.3
    fov_up: 20.9  # CODa: OS1-128, measured
    fov_down: -21.0  # CODa: OS1-128, measured
    fov_left: 180.0
    fov_right: -180.0
    fov_cut: -20
    checkneighbor_range: 1
    
    depth_thr1: 0.15
    enter_min_thr1: 0.5 # kill car front points (close to wall, related to view change)
    enter_max_thr1: 0.15 # equal to map_cons_depth_thr1, for save pedestrain close to wall
    map_cons_depth_thr1: 0.15
    map_cons_hor_thr1: 0.01
    map_cons_ver_thr1: 0.015
    map_cons_hor_dis1: 0.15
    map_cons_ver_dis1: 0.15
    depth_cons_depth_thr1: 0.5
    depth_cons_depth_max_thr1: 1.0
    depth_cons_hor_thr1: 0.01
    depth_cons_ver_thr1: 0.01
    enlarge_z_thr1 : -2.5
    enlarge_angle: 2.0
    enlarge_depth: 3.0
    occluded_map_thr1: 2
    case1_interp_en: true

    v_min_thr2: 1.0
    acc_thr2: 7.0
    map_cons_depth_thr2: 0.2
    map_cons_hor_thr2: 0.01
    map_cons_ver_thr2: 0.01
    occ_depth_thr2: 10.15
    occ_hor_thr2: 0.01
    occ_ver_thr2: 0.015
    depth_cons_depth_thr2: 0.1
    depth_cons_depth_max_thr2: 0.5
    depth_cons_hor_thr2: 0.01
    depth_cons_ver_thr2: 0.01
    occluded_times_thr2: 2
    k_depth2: 0.005
    case2_interp_en: false

    v_min_thr3: 0.5
    acc_thr3: 15.0
    map_cons_depth_thr3: 0.2
    map_cons_hor_thr3: 0.01
    map_cons_ver_thr3: 0.008
    occ_depth_thr3: 0.15
    occ_hor_thr3: 0.01
    occ_ver_thr3: 0.01
    depth_cons_depth_thr3: 0.3
    depth_cons_depth_max_thr3: 1.0
    depth_cons_hor_thr3: 0.01
    depth_cons_ver_thr3: 0.01
    occluding_times_thr3: 2
    case3_interp_en: false

    interp_hor_thr: 0.015
    interp_ver_thr: 0.007
    interp_thr1: 0.5
    interp_static_max: 10.0
    interp_start_depth1: 10
    interp_kp1: 0.1
    interp_kd1: 0.5
    # interp_bg: 0.8
    interp_thr2: 0.25
    interp_thr3: 0.05

    point_index:  -1 
    debug_x: 7.2065
    debug_y: -3.1844
    debug_z: -0.89005

    cluster_coupled: true
    cluster_future: true
    cluster_extend_pixel: 2
    cluster_min_pixel_number: 8
    cluster_thrustable_thresold: 0.3
    cluster_Voxel_revolusion: 0.3
    
    dyn_filter_en: false
    debug_publish: false
   
    ver_resolution_max: 0.0058  # CODa: OS1-128 ring spacing (measured)
    hor_resolution_max: 0.0061  # CODa: OS1-128, 1024 columns
    